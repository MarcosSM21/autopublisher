name: CI

# The full CI runs once per pull request state against main; merging to main only
# happens from a green PR, so pushes do not run it again. Use workflow_dispatch to
# run it by hand.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A new push to the PR cancels the run of its previous state.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      # Recommended packages (speech models, VA/VDPAU drivers) are a third of the
      # download and unused by the tests. The step takes ~20 s; a slow Ubuntu
      # mirror once stalled it for 45+ min, so fail fast instead of waiting
      # for the 6 h job default.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
        timeout-minutes: 10
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
